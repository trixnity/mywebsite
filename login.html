<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Chess Foundation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="index.html">
                        <img src="assets/logo-icon.png" alt="Logo Icon" class="nav-icon">
                        Master Chess Foundation
                    </a>
                </li>
                <li class="dropdown">
                    <a href="#" class="dropbtn">Details</a>
                    <div class="dropdown-content">
                        <a href="achievements.html">Achievements</a>
                        <a href="classes.html">Classes</a>
                        <a href="coaches.html">Coaches</a>
                    </div>
                </li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li class="search-container">
                    <input type="text" id="search-input" placeholder="Search..." />
                    <button id="search-button">Search</button>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="login-container">
            <h2>Login</h2>
            <form id="loginForm" method="post" action="student-dashboard.html">
                <div class="role-options">
                    <input type="radio" id="student" name="role" value="student" checked>
                    <label for="student">Student</label>
                    <input type="radio" id="coach" name="role" value="coach">
                    <label for="coach">Coach</label>
                </div>
                <label for="username">User ID:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Login</button>
            </form>            
            
            <p>Don't have an account? <a href="register.html">Register here</a>.</p>
        </section>
    </main>
    

<footer>
    <p>&copy; 2025 Master Chess Foundation. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
